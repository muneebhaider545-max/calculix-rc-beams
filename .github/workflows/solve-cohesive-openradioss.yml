name: Solve cohesive OpenRadioss C25-CFRP

on:
  workflow_dispatch:
  push:
    paths:
      - 'openradioss_native/generate_c25_cfrp_cohesive.py'
      - '.github/workflows/solve-cohesive-openradioss.yml'

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate cohesive model
        run: |
          mkdir -p run_cohesive
          cd run_cohesive
          python3 ../openradioss_native/generate_c25_cfrp_cohesive.py
          ls -lh
      - name: Download OpenRadioss
        run: |
          wget -q https://github.com/OpenRadioss/OpenRadioss/releases/download/latest-20260728/OpenRadioss_linux64.zip -O or.zip
          echo "598ed7b2905a7bacc8d1781470c250ac79d7558c39ba962768edf3644644fe33  or.zip" | sha256sum -c -
          unzip -q or.zip -d openradioss
          chmod +x openradioss/OpenRadioss/exec/*
      - name: Run Starter
        env:
          RAD_CFG_PATH: ${{ github.workspace }}/openradioss/OpenRadioss/hm_cfg_files
        run: |
          set -o pipefail
          LIB=$(dirname "$(realpath "$(find openradioss/OpenRadioss -name 'libhm_reader_linux64.so' | head -1)")")
          export LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}"
          cd run_cohesive
          ../openradioss/OpenRadioss/exec/starter_linux64_gf -i C25_CFRP_COHESIVE_0000.rad -nt 1 2>&1 | tee starter.log
      - name: Run Engine
        env:
          RAD_CFG_PATH: ${{ github.workspace }}/openradioss/OpenRadioss/hm_cfg_files
        run: |
          set -o pipefail
          cd run_cohesive
          ../openradioss/OpenRadioss/exec/engine_linux64_gf -i C25_CFRP_COHESIVE_0001.rad -nt 1 2>&1 | tee engine.log
      - name: Convert outputs and summarize
        if: always()
        run: |
          cd run_cohesive
          if [ -f C25_CFRP_COHESIVET01 ]; then
            ../openradioss/OpenRadioss/exec/th_to_csv_linux64_gf C25_CFRP_COHESIVET01 || true
          fi
          LAST=$(ls C25_CFRP_COHESIVEA*.gz 2>/dev/null | sort | tail -1 || true)
          if [ -n "$LAST" ]; then
            gzip -dkf "$LAST"
            RAW=${LAST%.gz}
            ../openradioss/OpenRadioss/exec/anim_to_vtk_linux64_gf "$RAW" > C25_CFRP_COHESIVE_final.vtk || true
          fi
          python3 ../openradioss_native/postprocess_c25_cfrp_cohesive.py
          cat C25_CFRP_COHESIVE_metadata.txt
          ls -lh
      - name: Upload cohesive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C25-CFRP-LAW169-Cohesive-Results
          path: run_cohesive/*
          if-no-files-found: error