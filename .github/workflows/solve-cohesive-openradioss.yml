name: Solve cohesive OpenRadioss C25-CFRP

on:
  workflow_dispatch:
  push:
    paths:
      - 'openradioss_native/generate_c25_cfrp_cohesive.py'
      - '.github/workflows/solve-cohesive-openradioss.yml'

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate cohesive model
        run: |
          mkdir -p run_cohesive
          cd run_cohesive
          python3 ../openradioss_native/generate_c25_cfrp_cohesive.py
          ls -lh
      - name: Download OpenRadioss
        run: |
          wget -q https://github.com/OpenRadioss/OpenRadioss/releases/download/latest-20260728/OpenRadioss_linux64.zip -O or.zip
          echo "598ed7b2905a7bacc8d1781470c250ac79d7558c39ba962768edf3644644fe33  or.zip" | sha256sum -c -
          unzip -q or.zip -d openradioss
          chmod +x openradioss/OpenRadioss/exec/*
      - name: Run Starter
        env:
          RAD_CFG_PATH: ${{ github.workspace }}/openradioss/OpenRadioss/hm_cfg_files
        run: |
          set -o pipefail
          LIB=$(dirname "$(realpath "$(find openradioss/OpenRadioss -name 'libhm_reader_linux64.so' | head -1)")")
          export LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}"
          cd run_cohesive
          ../openradioss/OpenRadioss/exec/starter_linux64_gf -i C25_CFRP_COHESIVE_0000.rad -nt 1 2>&1 | tee starter.log
      - name: Run Engine
        env:
          RAD_CFG_PATH: ${{ github.workspace }}/openradioss/OpenRadioss/hm_cfg_files
        run: |
          set -o pipefail
          cd run_cohesive
          ../openradioss/OpenRadioss/exec/engine_linux64_gf -i C25_CFRP_COHESIVE_0001.rad -nt 1 2>&1 | tee engine.log
      - name: Convert outputs and summarize
        if: always()
        run: |
          cd run_cohesive
          if [ -f C25_CFRP_COHESIVET01 ]; then
            ../openradioss/OpenRadioss/exec/th_to_csv_linux64_gf C25_CFRP_COHESIVET01 || true
          fi
          LAST=$(ls C25_CFRP_COHESIVEA*.gz 2>/dev/null | sort | tail -1 || true)
          if [ -n "$LAST" ]; then
            gzip -dkf "$LAST"
            RAW=${LAST%.gz}
            ../openradioss/OpenRadioss/exec/anim_to_vtk_linux64_gf "$RAW" > C25_CFRP_COHESIVE_final.vtk || true
          fi
          python3 - <<'PY'
import csv,glob,os
fn=glob.glob('C25_CFRP_COHESIVET01.csv')
if fn:
    with open(fn[0],newline='') as f: rows=list(csv.reader(f))
    h=rows[0]; num=[]
    for r in rows[1:]:
        try:num.append([float(x) for x in r])
        except:pass
    cols=[i for i,x in enumerate(h) if 'Load line nodes' in x]
    if len(cols)>=6 and num:
        dz=cols[0::2][:3]; rz=cols[1::2][:3]
        data=[]
        for v in num:
            d=sum(v[i] for i in dz)/3.0; R=sum(v[i] for i in rz); data.append((v[0],d,abs(R)/1000.0))
        peak=max(data,key=lambda q:q[2])
        ie=h.index('INTERNAL ENERGY') if 'INTERNAL ENERGY' in h else None
        ke=h.index('KINETIC ENERGY') if 'KINETIC ENERGY' in h else None
        ratios=[]
        if ie is not None and ke is not None:
            for v in num:
                if abs(v[ie])>1e-12: ratios.append(abs(v[ke])/abs(v[ie]))
        with open('cohesive_solver_summary.txt','w') as f:
            f.write(f'Peak reaction load = {peak[2]:.6f} kN\n')
            f.write(f'Displacement at peak = {peak[1]:.6f} mm\n')
            f.write(f'Peak time = {peak[0]:.6f} s\n')
            f.write(f'Peak load error vs 99.5 kN = {(peak[2]-99.5)/99.5*100:.3f}%\n')
            f.write(f'Max KE/IE = {max(ratios) if ratios else float("nan"):.6f}\n')
        print(open('cohesive_solver_summary.txt').read())
PY
          cat C25_CFRP_COHESIVE_metadata.txt
          ls -lh
      - name: Upload cohesive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C25-CFRP-LAW169-Cohesive-Results
          path: run_cohesive/*
          if-no-files-found: error