name: Solve native OpenRadioss C25-CFRP

on:
  workflow_dispatch:
  push:
    paths:
      - 'openradioss_native/**'
      - '.github/workflows/solve-native-openradioss.yml'

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate native Radioss model
        run: |
          mkdir -p run_native
          cd run_native
          python3 ../openradioss_native/generate_c25_cfrp_native.py
          ls -lh
      - name: Download OpenRadioss
        run: |
          wget -q https://github.com/OpenRadioss/OpenRadioss/releases/download/latest-20260728/OpenRadioss_linux64.zip -O or.zip
          echo "598ed7b2905a7bacc8d1781470c250ac79d7558c39ba962768edf3644644fe33  or.zip" | sha256sum -c -
          unzip -q or.zip -d openradioss
          chmod +x openradioss/OpenRadioss/exec/*
          find openradioss/OpenRadioss -name 'libhm_reader_linux64.so' -print
      - name: Run Starter
        env:
          RAD_CFG_PATH: ${{ github.workspace }}/openradioss/OpenRadioss/hm_cfg_files
        run: |
          set -o pipefail
          LIB=$(dirname "$(realpath "$(find openradioss/OpenRadioss -name 'libhm_reader_linux64.so' | head -1)")")
          export LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}"
          cd run_native
          ../openradioss/OpenRadioss/exec/starter_linux64_gf -i C25_CFRP_NATIVE_0000.rad -nt 1 2>&1 | tee starter.log
      - name: Run Engine
        env:
          RAD_CFG_PATH: ${{ github.workspace }}/openradioss/OpenRadioss/hm_cfg_files
        run: |
          set -o pipefail
          cd run_native
          ../openradioss/OpenRadioss/exec/engine_linux64_gf -i C25_CFRP_NATIVE_0001.rad -nt 1 2>&1 | tee engine.log
      - name: Convert time histories to CSV
        if: always()
        run: |
          cd run_native
          ls -lah
          if ls *T01 1>/dev/null 2>&1; then
            ../openradioss/OpenRadioss/exec/th_to_csv_linux64_gf C25_CFRP_NATIVET01 || true
          fi
          if [ -f C25_CFRP_NATIVEA051.gz ]; then
            gzip -dkf C25_CFRP_NATIVEA051.gz
            ../openradioss/OpenRadioss/exec/anim_to_vtk_linux64_gf C25_CFRP_NATIVEA051 > C25_CFRP_final.vtk || true
          fi
          echo '=== CSV files ==='
          ls -lh *.csv 2>/dev/null || true
          for q in *.csv; do [ -f "$q" ] && { echo "=== $q HEAD ==="; head -8 "$q"; }; done
          echo '=== VTK files ==='
          ls -lh *.vtk 2>/dev/null || true
          python3 - <<'PY'
import csv, re, math, os
fn='C25_CFRP_NATIVET01.csv'
if os.path.exists(fn):
    with open(fn,newline='') as f:
        rows=list(csv.reader(f))
    hdr=rows[0]
    # Identify load-node DZ and REACZ columns from the converted TH/NODE group.
    load_cols=[(i,h) for i,h in enumerate(hdr) if 'Load line nodes' in h]
    print('LOAD_HISTORY_COLUMNS')
    for i,h in load_cols: print(i,h)
    numeric=[]
    for row in rows[1:]:
        try: vals=[float(x) for x in row]
        except: continue
        numeric.append(vals)
    # TH/NODE ordering is DZ then REACZ for each listed node.
    if len(load_cols)>=6 and numeric:
        idx=[i for i,h in load_cols]
        dz_idx=idx[0::2][:3]
        rz_idx=idx[1::2][:3]
        out=[]
        for vals in numeric:
            t=vals[0]
            dz=sum(vals[i] for i in dz_idx)/len(dz_idx)
            reac=sum(vals[i] for i in rz_idx)
            out.append((t,dz,reac,abs(reac)/1000.0))
        with open('C25_CFRP_load_deflection.csv','w',newline='') as f:
            w=csv.writer(f); w.writerow(['time_s','midspan_DZ_mm','sum_REACZ_N','load_kN']); w.writerows(out)
        peak=max(out,key=lambda r:r[3])
        # energies
        iei=hdr.index('INTERNAL ENERGY') if 'INTERNAL ENERGY' in hdr else None
        kei=hdr.index('KINETIC ENERGY') if 'KINETIC ENERGY' in hdr else None
        ratios=[]
        if iei is not None and kei is not None:
            for vals in numeric:
                ie=abs(vals[iei]); ke=abs(vals[kei])
                if ie>1e-12: ratios.append(ke/ie)
        ratio_max=max(ratios) if ratios else float('nan')
        with open('C25_CFRP_solver_summary.txt','w') as f:
            f.write('GENUINE OPENRADIOSS 3D SOLVER RESULT\n')
            f.write(f'Peak reaction load = {peak[3]:.6f} kN\n')
            f.write(f'Midspan displacement at peak = {peak[1]:.6f} mm\n')
            f.write(f'Peak time = {peak[0]:.6f} s\n')
            f.write('Experimental Pu = 99.5 kN\nExperimental delta_u = 20.058 mm\n')
            f.write(f'Max KE/IE ratio = {ratio_max:.6f}\n')
        print(open('C25_CFRP_solver_summary.txt').read())
PY
          find . -maxdepth 1 -type f -printf '%f\n' | sort > files.txt
      - name: Upload genuine solver outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C25-CFRP-Genuine-OpenRadioss-3D
          path: |
            run_native/*
          if-no-files-found: error